<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Principal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR (Tu responsabilidad) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Botón de hamburguesa para el sidebar (lo usará tu compañero) -->
            <button class="btn btn-outline-light me-3" id="btnHamburguesa">☰</button>
            <a class="navbar-brand" href="#">Mi Sistema</a>
            
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <!-- Dropdown del usuario -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="menuUsuario" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            👤 <span id="nombreUsuario">Cargando...</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
                            <li><a class="dropdown-item text-danger" href="#" id="btnSalir">Salir del sistema</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- empieza mi parte Mario -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">
        <!-- Sidebar -->
        <div id="sidebar" class="bg-dark text-white p-3" style="width: 250px; transition: 0.3s;">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white dropdown-toggle" href="#" data-bs-toggle="collapse" data-bs-target="#menuUsuarios">Usuarios</a>
                    <div class="collapse" id="menuUsuarios">
                        <ul class="nav flex-column ms-3">
                            <li><a class="nav-link text-light" href="#" id="linkCaptura">Captura</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Contenido principal -->
        <div class="p-4 w-100">
            <div id="seccionCaptura" class="card mb-4">
                <div class="card-header bg-primary text-white">Captura de Usuarios</div>
                <div class="card-body">
                    <form id="formCaptura">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="capNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" id="capCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="capPassword" required>
                        </div>
                        <button type="submit" class="btn btn-success">Guardar Usuario</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-info text-white">Registro de Alumnos</div>
                <div class="card-body">
                    <form id="formAlumnos">
                        <div class="mb-3">
                            <label class="form-label">Número de Control (6 dígitos exactos)</label>
                            <input type="number" class="form-control" id="numControl" required>
                            <div id="errorControl" class="text-danger d-none small mt-1">El número debe tener exactamente 6 dígitos.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Edad del alumno</label>
                            <input type="number" class="form-control" id="edadAlumno" required>
                        </div>
                        <button type="button" class="btn btn-dark" id="btnVerificarEdad">Verificar Edad</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edad -->
    <div class="modal fade" id="modalEdad" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Resultado de Verificación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="mensajeModalEdad" class="fs-5 text-center my-3"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/utileria.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
